<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/style.css"><title>Login — VXCHAT</title>
</head>
<body class="auth-page">
  <section class="auth-card">
    <a class="back" href="index.html">← VXCHAT</a>
    <div class="brand-mark small">VX</div>
    <h1>Welcome back</h1>
    <p class="muted">Sign in with your VXCHAT username.</p>
    <form id="loginForm">
      <label>Username<input id="username" autocomplete="username" placeholder="@username" required></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Your password" required></label>
      <button class="btn primary full" type="submit">Sign in</button>
      <p id="message" class="form-message"></p>
    </form>
    <p class="switch">No account? <a href="register.html">Create one</a></p>
  </section>
  <script type="module" src="js/login.js"></script>
</body>
</html>
